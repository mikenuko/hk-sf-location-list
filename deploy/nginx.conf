# Serve the SF HK JSON dataset as a tiny read-only static API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # JSON/CSV/GeoJSON with permissive CORS so browser apps + other services can fetch.
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        autoindex on;                      # browsable file listing at /
        types {
            application/json    json geojson;
            text/csv            csv;
        }
        default_type application/json;
    }

    # Lightweight health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
