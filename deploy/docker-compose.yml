# Optional static file server for the published SF HK JSON dataset.
# The self-hosted GitHub Actions runner writes the JSON to /srv/sfhk/data
# (see .github/workflows/refresh.yml -> "Publish JSON to server").
# This nginx just exposes that directory read-only. No UI, just files.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Then: http://<host>:8088/locations.json
# Or via Tailscale HTTPS (see deploy/README.md): https://<host>.<tailnet>.ts.net/locations.json

services:
  sfhk-data:
    image: nginx:alpine
    container_name: sfhk-data
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /srv/sfhk/data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
