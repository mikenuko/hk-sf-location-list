name: Refresh SF HK pickup locations

on:
  schedule:
    - cron: "17 20 * * *" # daily ~04:17 HKT (UTC+8); off-peak minute to avoid the fleet
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # commit refreshed data back to the repo (audit trail)

concurrency:
  group: refresh
  cancel-in-progress: false # let an in-flight scrape finish; runs are idempotent

jobs:
  refresh:
    # Runs on the self-hosted runner on mikeneko-docker-main (HK IP clears the SF WAF cleanly).
    runs-on: [self-hosted, sfhk]
    env:
      # Where the published JSON lands on the Docker host. Override in the runner env if needed.
      DEPLOY_DIR: ${{ vars.SFHK_DEPLOY_DIR || '/srv/sfhk/data' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies (signed fetch, no browser) — just run the build.
      - name: Build dataset
        run: npm run refresh

      - name: Commit if changed
        run: |
          git config user.name "sfhk-bot"
          git config user.email "sfhk-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%F) [skip ci]"
            git push
          fi

      # "Deploy" = publish the JSON to the Docker host directory. Atomic rsync,
      # --delete keeps removed district files from lingering. No UI, no Pages.
      - name: Publish JSON to server
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude='.snapshot.json' data/ "$DEPLOY_DIR"/
          echo "Published $(ls -1 "$DEPLOY_DIR" | wc -l) entries to $DEPLOY_DIR"
