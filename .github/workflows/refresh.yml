name: Refresh SF HK pickup locations

on:
  schedule:
    - cron: "17 20 * * *" # daily ~04:17 HKT (UTC+8); off-peak minute to avoid the fleet
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # commit refreshed data back to the repo

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned Chromium (matches the installed playwright version) + its OS libs.
      - run: npx playwright install --with-deps chromium

      - name: Build dataset
        env:
          PW_CHANNEL: chromium
        run: npm run refresh

      - name: Commit if changed
        run: |
          git config user.name "sfhk-bot"
          git config user.email "sfhk-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%F) [skip ci]"
            git push
          fi
