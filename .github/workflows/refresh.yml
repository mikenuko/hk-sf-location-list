name: Refresh SF HK pickup locations

on:
  schedule:
    - cron: "17 20 * * *" # daily ~04:17 HKT (UTC+8); off-peak minute to avoid the fleet
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write # deploy to GitHub Pages
  id-token: write # required by deploy-pages

concurrency:
  group: pages # match GitHub's Pages concurrency convention so overlapping deploys don't collide
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned Chromium (matches the installed playwright version) + its OS libs.
      - run: npx playwright install --with-deps chromium

      - name: Build dataset
        env:
          PW_CHANNEL: chromium
        run: npm run refresh

      - name: Commit if changed
        run: |
          git config user.name "sfhk-bot"
          git config user.email "sfhk-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%F) [skip ci]"
            git push
          fi

      # Publish the data files + landing page to GitHub Pages.
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r data/. _site/
          cp site/index.html _site/index.html
          rm -f _site/.snapshot.json   # internal diffing artifact, not for publishing

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
