<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF HK Pickup Locations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --line: #e3e3e3; --accent: #d0021b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
    header h1 { font-size: 16px; margin: 0; }
    header .stat { color: var(--muted); }
    header .stat b { color: var(--fg); }
    header a { color: var(--accent); text-decoration: none; }
    header .links { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; }
    .leaflet-popup-content b { display: block; margin-bottom: 2px; }
    .leaflet-popup-content .tc { color: var(--muted); }
    .leaflet-popup-content .meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; padding: 0 6px; border-radius: 10px; background: #f1f1f1; color: #555; font-size: 11px; margin-right: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>SF&nbsp;HK Pickup Locations</h1>
      <span class="stat"><b id="count">…</b> outlets</span>
      <span class="stat">updated <b id="updated">…</b></span>
      <span class="stat">source <b id="version">…</b></span>
      <nav class="links">
        <a href="./locations.geojson">GeoJSON</a>
        <a href="./locations.json">JSON</a>
        <a href="./meta.json">meta</a>
        <a href="./changelog.json">changelog</a>
      </nav>
    </header>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([22.36, 114.13], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const esc = (s) => (s == null ? '' : String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])));
    const popup = (p) => {
      const tags = [p.is_station && 'station', p.is_locker && 'locker', p.is_partner && 'partner', p.cold_chain && 'cold-chain']
        .filter(Boolean).map((t) => `<span class="badge">${t}</span>`).join('');
      return `<b>${esc(p.name_en)}</b>${p.name_tc ? `<span class="tc">${esc(p.name_tc)}</span>` : ''}
        <div class="meta">${esc(p.address_en)}</div>
        ${p.hours_en ? `<div class="meta">🕑 ${esc(p.hours_en)}</div>` : ''}
        ${p.telephone ? `<div class="meta">☎ ${esc(p.telephone)}</div>` : ''}
        <div class="meta">${tags}</div>`;
    };

    // Published Pages flattens data to the root (./); local dev serves it from ../data/.
    const BASES = ['./', '../data/'];
    const getJSON = async (name) => {
      for (const b of BASES) { try { const r = await fetch(b + name); if (r.ok) return r.json(); } catch (_) {} }
      throw new Error('not found: ' + name);
    };

    Promise.all([getJSON('meta.json'), getJSON('locations.geojson')]).then(([meta, geo]) => {
      document.getElementById('count').textContent = meta.count.toLocaleString();
      document.getElementById('updated').textContent = (meta.generated_at || '').slice(0, 10);
      document.getElementById('version').textContent = meta.source_version || '—';
      const layer = L.geoJSON(geo, {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, {
          radius: 4, color: '#d0021b', weight: 1, fillColor: '#d0021b', fillOpacity: 0.6,
        }),
        onEachFeature: (f, l) => l.bindPopup(popup(f.properties)),
      }).addTo(map);
      try { map.fitBounds(layer.getBounds(), { padding: [20, 20] }); } catch (_) {}
    }).catch((e) => {
      document.getElementById('count').textContent = 'failed to load';
      console.error(e);
    });
  </script>
</body>
</html>
