<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF HK Pickup Locations</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --line: #e6e6e6; --accent: #d0021b; --zebra: #fafafa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; color: var(--fg); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
    .row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
    h1 { font-size: 16px; margin: 0; }
    .stat { color: var(--muted); } .stat b { color: var(--fg); }
    .links { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }
    a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
    .controls { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    input#q { flex: 1; min-width: 220px; }
    .seg { display: inline-flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 7px 12px; font: inherit; cursor: pointer; color: var(--muted); }
    .seg button.on { background: var(--accent); color: #fff; }
    .btn { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; color: var(--fg); }
    .btn:hover { border-color: #999; }
    .btn:disabled { opacity: .6; cursor: default; }
    .wrap { padding: 0 18px 40px; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
    th { position: sticky; top: 96px; background: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); cursor: pointer; white-space: nowrap; }
    th:hover { color: var(--fg); }
    tbody tr:nth-child(even) { background: var(--zebra); }
    /* Fixed column widths keep the copy buttons aligned in one line. */
    col.c-code { width: 84px; } col.c-dist { width: 92px; } col.c-district { width: 130px; }
    col.c-hours { width: 190px; } col.c-phone { width: 104px; }
    .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-weight: 600; white-space: nowrap; }
    .dist { white-space: nowrap; color: var(--accent); font-variant-numeric: tabular-nums; }
    .addr-flex { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .addr-flex > span { min-width: 0; }
    .copy { flex: none; border: 1px solid #ccc; background: #fff; border-radius: 5px; padding: 2px 8px; font-size: 12px; line-height: 1.6; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .copy:hover { color: var(--fg); border-color: #999; }
    .copy.done { color: #137333; border-color: #137333; }
    .hrs { color: var(--muted); font-size: 13px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="row1">
      <h1>SF&nbsp;HK Pickup Locations</h1>
      <span class="stat"><b id="shown">…</b> / <b id="count">…</b> outlets</span>
      <span class="stat">updated <b id="updated">…</b></span>
      <nav class="links">
        <a href="./locations.csv" download>CSV</a>
        <a href="./locations.json">JSON</a>
        <a href="./meta.json">meta</a>
      </nav>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search code, name, address…" autocomplete="off" />
      <select id="district"><option value="">All districts</option></select>
      <select id="type"></select>
      <button id="near" class="btn">📍 <span id="near-label">Nearest</span></button>
      <span class="seg" id="lang" role="group" aria-label="Language">
        <button data-lang="en" class="on">English</button>
        <button data-lang="tc">繁體中文</button>
      </span>
    </div>
  </header>

  <div class="wrap">
    <table>
      <colgroup>
        <col class="c-code" /><col class="c-dist" /><col class="c-name" /><col class="c-addr" />
        <col class="c-district" /><col class="c-hours" /><col class="c-phone" />
      </colgroup>
      <thead>
        <tr>
          <th data-k="code">Code</th>
          <th data-k="distance" id="h-dist">Distance</th>
          <th data-k="name" id="h-name">Name</th>
          <th data-k="address" id="h-addr">Address</th>
          <th data-k="district" id="h-district">District</th>
          <th data-k="hours" id="h-hours">Hours</th>
          <th data-k="telephone">Phone</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>No matches.</div>
  </div>

  <script>
    const BASES = ['./', '../data/']; // published Pages serves at ./, local dev at ../data/
    const getJSON = async (name) => {
      for (const b of BASES) { try { const r = await fetch(b + name); if (r.ok) return r.json(); } catch (_) {} }
      throw new Error('not found: ' + name);
    };
    const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
    const $ = (id) => document.getElementById(id);

    let ALL = [], sortK = 'code', sortDir = 1, distMap = {};
    let lang = localStorage.getItem('sfhk_lang') || 'en';

    const buildDistrictOptions = () => {
      const sel = $('district'), cur = sel.value;
      const ens = [...new Set(ALL.map((r) => r.district))].sort();
      const label = (en) => (lang === 'tc' ? (distMap[en] || en) : en);
      sel.innerHTML = `<option value="">${lang === 'tc' ? '所有地區' : 'All districts'}</option>`
        + ens.map((en) => `<option value="${esc(en)}">${esc(label(en))}</option>`).join('');
      sel.value = cur;
    };

    const TYPE_LABELS = {
      en: { '': 'All types', station: 'Station', partner: 'Partner', locker: 'Locker', cold_chain: 'Cold-chain' },
      tc: { '': '所有類型', station: '順豐站', partner: '合作點', locker: '智能櫃', cold_chain: '冷運' },
    };
    const buildTypeOptions = () => {
      const sel = $('type'), cur = sel.value, T = TYPE_LABELS[lang];
      sel.innerHTML = ['', 'station', 'partner', 'locker', 'cold_chain']
        .map((v) => `<option value="${v}">${esc(T[v])}</option>`).join('');
      sel.value = cur;
    };

    // Field for current language, falling back to English when a TC value is missing.
    const f = (r, base) => (lang === 'tc' ? (r[base + '_tc'] || r[base + '_en']) : r[base + '_en']);

    const LABELS = {
      en: { name: 'Name', address: 'Address', district: 'District', distance: 'Distance', hours: 'Hours', search: 'Search code, name, address…', copy: 'Copy', copied: 'Copied', near: 'Nearest', locating: 'Locating…', denied: 'Location blocked', geoerr: 'Location unavailable' },
      tc: { name: '名稱', address: '地址', district: '地區', distance: '距離', hours: '營業時間', search: '搜尋編號、名稱、地址…', copy: '複製', copied: '已複製', near: '最近地點', locating: '定位中…', denied: '定位被拒', geoerr: '無法定位' },
    };
    // District value in the active language (falls back to English).
    const distOf = (r) => (lang === 'tc' ? (r.district_tc || r.district) : r.district);

    let userPos = null, locating = false; // {lat, lng} once the user shares location
    const haversine = (a, b, c, d) => {
      const R = 6371, rad = Math.PI / 180;
      const dLat = (c - a) * rad, dLng = (d - b) * rad;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a * rad) * Math.cos(c * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s)); // km
    };
    const fmtDist = (km) => (km == null ? '—' : km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(km < 10 ? 1 : 0)} km`);

    const copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); return true; }
      catch (_) {
        const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        t.remove(); return ok;
      }
    };

    const render = () => {
      const L = LABELS[lang];
      const q = $('q').value.trim().toLowerCase();
      const district = $('district').value, type = $('type').value;
      let rows = ALL.filter((r) => {
        if (district && r.district !== district) return false;
        if (type) { if (type === 'cold_chain') { if (!r.cold_chain) return false; } else if (r.type !== type) return false; }
        if (q) {
          const hay = `${r.code} ${r.name_en} ${r.name_tc || ''} ${r.address_en} ${r.address_tc || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      if (sortK === 'distance') {
        rows.sort((a, b) => ((a._dist ?? Infinity) - (b._dist ?? Infinity)) * sortDir);
      } else {
        const key = (r) => sortK === 'district' ? distOf(r)
          : (sortK === 'name' || sortK === 'address' || sortK === 'hours') ? (f(r, sortK) || '')
          : (r[sortK] ?? '');
        rows.sort((a, b) => String(key(a)).localeCompare(String(key(b)), 'en', { numeric: true }) * sortDir);
      }

      $('rows').innerHTML = rows.map((r) => {
        const addr = f(r, 'address') || '';
        return `<tr>
          <td class="code">${esc(r.code)}</td>
          <td class="dist">${userPos ? esc(fmtDist(r._dist)) : '—'}</td>
          <td>${esc(f(r, 'name'))}</td>
          <td><div class="addr-flex">
            <span>${esc(addr)}</span>
            <button class="copy" data-copy="${esc(addr)}" title="${L.copy}">⧉ ${L.copy}</button>
          </div></td>
          <td>${esc(distOf(r))}</td>
          <td class="hrs">${esc(f(r, 'hours') || '')}</td>
          <td>${esc(r.telephone || '')}</td>
        </tr>`;
      }).join('');
      $('shown').textContent = rows.length.toLocaleString();
      $('empty').hidden = rows.length > 0;

      // Header labels + search placeholder follow the language.
      $('h-name').textContent = L.name; $('h-addr').textContent = L.address;
      $('h-district').textContent = L.district; $('h-hours').textContent = L.hours;
      $('h-dist').textContent = L.distance;
      if (!locating) $('near-label').textContent = L.near;
      $('q').placeholder = L.search;
    };

    // Copy buttons (event delegation, survives re-render).
    $('rows').addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy'); if (!btn) return;
      if (await copyText(btn.dataset.copy)) {
        const orig = btn.innerHTML; btn.innerHTML = '✓ ' + LABELS[lang].copied; btn.classList.add('done');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('done'); }, 1200);
      }
    });

    // Language toggle.
    $('lang').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-lang]'); if (!b) return;
      lang = b.dataset.lang; localStorage.setItem('sfhk_lang', lang);
      [...$('lang').children].forEach((c) => c.classList.toggle('on', c.dataset.lang === lang));
      buildDistrictOptions();
      buildTypeOptions();
      render();
    });

    // Find nearest: get the user's location, measure distance to every outlet, sort ascending.
    $('near').addEventListener('click', () => {
      if (locating) return;
      if (!navigator.geolocation) { $('near-label').textContent = LABELS[lang].geoerr; return; }
      locating = true;
      $('near').disabled = true;
      $('near-label').textContent = LABELS[lang].locating;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          ALL.forEach((r) => { r._dist = haversine(userPos.lat, userPos.lng, r.lat, r.lng); });
          locating = false; $('near').disabled = false; $('near-label').textContent = LABELS[lang].near;
          sortK = 'distance'; sortDir = 1;
          render();
          window.scrollTo({ top: 0 });
        },
        (err) => {
          locating = false; $('near').disabled = false;
          $('near-label').textContent = err.code === err.PERMISSION_DENIED ? LABELS[lang].denied : LABELS[lang].geoerr;
          setTimeout(() => { $('near-label').textContent = LABELS[lang].near; }, 2500);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 },
      );
    });

    document.querySelectorAll('th[data-k]').forEach((th) => th.addEventListener('click', () => {
      const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; render();
    }));
    ['q', 'district', 'type'].forEach((id) => $(id).addEventListener('input', render));

    Promise.all([getJSON('meta.json'), getJSON('locations.json')]).then(([meta, data]) => {
      ALL = data;
      $('count').textContent = meta.count.toLocaleString();
      $('updated').textContent = (meta.generated_at || '').slice(0, 10);
      ALL.forEach((r) => { if (r.district_tc && !distMap[r.district]) distMap[r.district] = r.district_tc; });
      buildDistrictOptions();
      buildTypeOptions();
      [...$('lang').children].forEach((c) => c.classList.toggle('on', c.dataset.lang === lang));
      render();
    }).catch((e) => { $('rows').innerHTML = ''; $('empty').hidden = false; $('empty').textContent = 'Failed to load data.'; console.error(e); });
  </script>
</body>
</html>
